<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamantes Express FF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-4 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <span class="bg-amber-500 text-slate-950 font-black px-2 py-1 rounded text-sm tracking-wider">FF</span>
            <h1 class="font-extrabold text-lg tracking-wide text-white">DIAMANTES <span class="text-amber-400">EXPRESS</span></h1>
        </div>
        <div class="flex items-center space-x-3">
            <a href="admin.html" class="text-slate-400 hover:text-amber-400 transition text-sm"><i class="fa-solid fa-lock"></i></a>
            <div class="bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 flex items-center space-x-1.5 text-xs font-semibold text-amber-400">
                <i class="fa-solid fa-circle text-[8px] animate-pulse"></i>
                <span>En Línea</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto w-full p-4 space-y-6 mb-12">

        <!-- Carrusel Dinámico de Ofertas y Agendas -->
        <section id="carousel-section" class="hidden">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-bullhorn"></i> Novedades y Ofertas
                </h2>
                <span class="text-[10px] text-slate-400 font-medium">Desliza para ver más <i class="fa-solid fa-arrow-right ml-0.5"></i></span>
            </div>
            
            <!-- Contenedor Deslizable Horizontal -->
            <div id="dynamic-carousel" class="flex overflow-x-auto space-x-3 pb-3 no-scrollbar snap-x snap-mandatory">
                <!-- Se llena automáticamente con JavaScript -->
            </div>
        </section>

        <!-- Selección de Paquetes (Ejemplo base) -->
        <section>
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-1.5">
                <i class="fa-solid fa-gem text-amber-400"></i> Paquetes Populares
            </h2>
            <div class="grid grid-cols-2 gap-3">
                <!-- Paquete 1 -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between relative overflow-hidden shadow-sm">
                    <div class="absolute top-0 right-0 bg-amber-500 text-slate-950 font-black text-[9px] px-2 py-0.5 rounded-bl font-mono">POPULAR</div>
                    <div>
                        <div class="flex items-center space-x-1 text-amber-400 font-bold text-lg mb-1">
                            <span>341</span> <i class="fa-solid fa-gem text-sm"></i>
                        </div>
                        <p class="text-xs text-slate-400 mb-3">Recarga directa por ID</p>
                    </div>
                    <div>
                        <div class="text-sm font-black text-white mb-2">840 CUP</div>
                        <a href="https://wa.me/+5350299740?text=Hola,%20quiero%20comprar%20el%20paquete%20de%20341%20diamantes." target="_blank" class="block w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-center py-2 rounded-xl text-xs transition shadow-md">
                            Comprar
                        </a>
                    </div>
                </div>

                <!-- Paquete 2 -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between shadow-sm">
                    <div>
                        <div class="flex items-center space-x-1 text-amber-400 font-bold text-lg mb-1">
                            <span>110</span> <i class="fa-solid fa-gem text-sm"></i>
                        </div>
                        <p class="text-xs text-slate-400 mb-3">Recarga directa por ID</p>
                    </div>
                    <div>
                        <div class="text-sm font-black text-white mb-2">280 CUP</div>
                        <a href="https://wa.me/+5350299740?text=Hola,%20quiero%20comprar%20el%20paquete%20de%20110%20diamantes." target="_blank" class="block w-full bg-slate-800 hover:bg-slate-700 text-white font-bold text-center py-2 rounded-xl text-xs border border-slate-700 transition">
                            Comprar
                        </a>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 px-4 text-center text-xs text-slate-500">
        <p>© 2026 Diamantes Express FF. Todos los derechos reservados.</p>
    </footer>

    <!-- Script para Cargar el Carrusel Dinámico -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const savedItems = localStorage.getItem("express_carousel_items");
            const carouselSection = document.getElementById("carousel-section");
            const carouselContainer = document.getElementById("dynamic-carousel");

            if (savedItems) {
                try {
                    const items = JSON.parse(savedItems);
                    if (items.length > 0) {
                        carouselSection.classList.remove("hidden");
                        carouselContainer.innerHTML = "";

                        items.forEach(item => {
                            const card = document.createElement("div");
                            card.className = "min-w-[260px] max-w-[260px] bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex-shrink-0 snap-start flex flex-col justify-between shadow-md";
                            
                            card.innerHTML = `
                                <div>
                                    <div class="h-36 w-full bg-slate-950 overflow-hidden relative">
                                        <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover">
                                    </div>
                                    <div class="p-3">
                                        <h3 class="font-bold text-sm text-white mb-1 line-clamp-1">${item.title}</h3>
                                        <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed">${item.description}</p>
                                    </div>
                                </div>
                                <div class="p-3 pt-0">
                                    <a href="https://wa.me/+5350299740?text=Hola,%20me%20interesa%20la%20oferta:%20${encodeURIComponent(item.title)}" target="_blank" class="block w-full bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold text-center py-2 rounded-xl text-xs border border-slate-700 transition">
                                        Pedir por WhatsApp
                                    </a>
                                </div>
                            `;
                            carouselContainer.appendChild(card);
                        });
                    }
                } catch (e) {
                    console.error("Error al cargar los elementos del carrusel", e);
                }
            }
        });
    </script>
</body>
</html>
