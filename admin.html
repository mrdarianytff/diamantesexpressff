<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Diamantes Express FF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0a0c16; color: #fff; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4">

    <!-- Pantalla de Bloqueo por Contraseña -->
    <div id="auth-screen" class="fixed inset-0 bg-[#0a0c16] z-50 flex items-center justify-center p-4">
        <div class="bg-[#161b2e] border border-[#00f0ff]/30 rounded-2xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl">
            <div class="w-12 h-12 bg-[#00f0ff]/10 border border-[#00f0ff]/30 rounded-2xl flex items-center justify-center mx-auto text-[#00f0ff] text-xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div>
                <h2 style="font-family: 'Orbitron', sans-serif;" class="text-lg font-bold text-white">Panel Protegido</h2>
                <p class="text-xs text-gray-400 mt-1">Ingresa tu contraseña de administración.</p>
            </div>
            <form id="auth-form" class="space-y-3">
                <input type="password" id="admin-pass" required placeholder="Contraseña..." class="w-full bg-[#0a0c16] border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-center text-white focus:outline-none focus:border-[#00f0ff]">
                <button type="submit" class="w-full bg-[#00f0ff] hover:bg-[#00d2df] text-[#0a0c16] font-bold py-2.5 rounded-xl text-xs transition shadow-md" style="font-family: 'Orbitron', sans-serif;">
                    Entrar al Panel
                </button>
            </form>
            <a href="index.html" class="block text-xs text-gray-500 hover:text-gray-300 transition">Volver a la tienda</a>
        </div>
    </div>

    <!-- Contenido Principal del Panel -->
    <div class="max-w-md mx-auto w-full space-y-6">
        <header class="flex justify-between items-center bg-[#161b2e] border border-[#00f0ff]/20 p-4 rounded-2xl">
            <h1 style="font-family: 'Orbitron', sans-serif;" class="text-sm font-bold text-[#00f0ff]">ADMIN CARRUSEL</h1>
            <a href="index.html" class="bg-[#0a0c16] border border-gray-700 hover:border-[#00f0ff] px-3 py-1.5 rounded-xl text-xs font-bold transition">
                <i class="fa-solid fa-store mr-1"></i> Ver Tienda
            </a>
        </header>

        <!-- Formulario para agregar -->
        <div class="bg-[#161b2e] border border-[#00f0ff]/20 rounded-2xl p-4 space-y-4">
            <h2 style="font-family: 'Orbitron', sans-serif;" class="text-xs font-bold text-[#00f0ff] flex items-center gap-2">
                <i class="fa-solid fa-circle-plus"></i> Publicar Nuevo Anuncio / Agenda
            </h2>

            <form id="offer-form" class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Título</label>
                    <input type="text" id="title" required placeholder="Ej: Agenda Semanal / Oferta 2x1" class="w-full bg-[#0a0c16] border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-[#00f0ff]">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">URL de la Imagen</label>
                    <input type="url" id="image" required placeholder="https://..." class="w-full bg-[#0a0c16] border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-[#00f0ff]">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Descripción corta</label>
                    <textarea id="description" rows="2" required placeholder="Detalles..." class="w-full bg-[#0a0c16] border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-[#00f0ff]"></textarea>
                </div>
                <button type="submit" class="w-full bg-[#00f0ff] hover:bg-[#00d2df] text-[#0a0c16] font-bold py-2.5 rounded-xl text-xs transition" style="font-family: 'Orbitron', sans-serif;">
                    Agregar al Carrusel
                </button>
            </form>
        </div>

        <!-- Lista de Anuncios Activos -->
        <div class="bg-[#161b2e] border border-[#00f0ff]/20 rounded-2xl p-4 space-y-3">
            <h2 style="font-family: 'Orbitron', sans-serif;" class="text-xs font-bold text-gray-300">Anuncios en el Carrusel</h2>
            <div id="active-items-list" class="space-y-2">
                <!-- Se llena con JS -->
            </div>
        </div>
    </div>

    <footer class="text-center text-xs text-gray-500 mt-6">
        <p>© Diamantes Express FF</p>
    </footer>

    <script>
        const ADMIN_PASSWORD = "123"; // Cambia tu contraseña aquí si deseas

        document.addEventListener("DOMContentLoaded", () => {
            const authScreen = document.getElementById("auth-screen");
            const authForm = document.getElementById("auth-form");
            const passInput = document.getElementById("admin-pass");

            if (sessionStorage.getItem("admin_logged") === "true") {
                authScreen.style.display = "none";
            }

            authForm.addEventListener("submit", (e) => {
                e.preventDefault();
                if (passInput.value === ADMIN_PASSWORD) {
                    sessionStorage.setItem("admin_logged", "true");
                    authScreen.style.display = "none";
                } else {
                    alert("¡Contraseña incorrecta, bro!");
                    passInput.value = "";
                }
            });

            const form = document.getElementById("offer-form");
            const listContainer = document.getElementById("active-items-list");

            function getItems() {
                const data = localStorage.getItem("express_carousel_items");
                return data ? JSON.parse(data) : [];
            }

            function saveItems(items) {
                localStorage.setItem("express_carousel_items", JSON.stringify(items));
            }

            function renderList() {
                const items = getItems();
                listContainer.innerHTML = "";

                if (items.length === 0) {
                    listContainer.innerHTML = `<div class="text-center text-xs text-gray-500 py-3">No hay anuncios activos.</div>`;
                    return;
                }

                items.forEach((item, index) => {
                    const card = document.createElement("div");
                    card.className = "bg-[#0a0c16] border border-gray-800 rounded-xl p-3 flex items-center justify-between gap-3";
                    card.innerHTML = `
                        <div class="flex items-center space-x-3 overflow-hidden">
                            <img src="${item.image}" class="w-10 h-10 object-cover rounded-lg bg-black flex-shrink-0">
                            <div class="overflow-hidden">
                                <h3 class="font-bold text-xs text-white truncate">${item.title}</h3>
                                <p class="text-[10px] text-gray-400 truncate">${item.description}</p>
                            </div>
                        </div>
                        <button onclick="deleteItem(${index})" class="bg-red-500/10 text-red-400 p-2 rounded-lg text-xs hover:bg-red-500/20 transition">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    `;
                    listContainer.appendChild(card);
                });
            }

            form.addEventListener("submit", (e) => {
                e.preventDefault();
                const title = document.getElementById("title").value;
                const image = document.getElementById("image").value;
                const description = document.getElementById("description").value;

                const items = getItems();
                items.push({ title, image, description });
                saveItems(items);

                form.reset();
                renderList();
                alert("¡Anuncio agregado con éxito al carrusel!");
            });

            window.deleteItem = function(index) {
                if (confirm("¿Estás seguro de eliminar este anuncio?")) {
                    const items = getItems();
                    items.splice(index, 1);
                    saveItems(items);
                    renderList();
                }
            };

            renderList();
        });
    </script>
</body>
</html>
