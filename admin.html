<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Diamantes Express FF</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f0ff;
            --secondary: #ff007f;
            --accent: #ffe600;
            --bg-dark: #0a0c16;
            --card-bg: rgba(22, 27, 46, 0.75);
            --card-border: rgba(0, 240, 255, 0.2);
            --text: #ffffff;
            --text-muted: #a0aec0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(255, 0, 127, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            padding-bottom: 80px;
        }

        #auth-screen {
            position: fixed; inset: 0; background: rgba(10, 12, 22, 0.98); z-index: 99999;
            display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(15px);
        }

        .auth-card {
            background: var(--card-bg); border: 2px solid var(--primary); border-radius: 20px;
            padding: 30px; max-width: 350px; width: 100%; text-align: center; box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
        }

        .auth-icon {
            width: 60px; height: 60px; background: rgba(0, 240, 255, 0.1); border: 1px solid var(--primary);
            border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; color: var(--primary); font-size: 1.5rem;
        }

        header {
            text-align: center; padding: 25px 20px 15px; display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: 0 auto;
        }

        .logo-title {
            font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 900; text-transform: uppercase; color: var(--primary); text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .btn-store {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff;
            padding: 8px 14px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; text-decoration: none; transition: 0.3s;
        }

        .btn-store:hover { border-color: var(--primary); color: var(--primary); }

        .container { max-width: 600px; margin: 0 auto; padding: 0 15px; }

        .section-card {
            background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px;
            padding: 22px; margin-bottom: 20px; backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .section-header {
            font-family: 'Orbitron', sans-serif; font-size: 1rem; color: #fff; margin-bottom: 15px;
            display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 8px;
        }

        .section-header i { color: var(--primary); }

        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .form-group label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }

        .form-control {
            background: rgba(10, 12, 22, 0.8); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px; padding: 10px 12px; color: #fff; font-size: 0.9rem; outline: none; transition: 0.3s; width: 100%;
        }

        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }

        input[type="file"] { padding: 8px; cursor: pointer; }
        input[type="file"]::file-selector-button {
            background: var(--primary); color: var(--bg-dark); border: none; padding: 6px 12px;
            border-radius: 6px; font-weight: 700; cursor: pointer; margin-right: 10px; transition: 0.2s;
        }
        input[type="file"]::file-selector-button:hover { background: #00d2df; }

        .btn-action {
            width: 100%; background: linear-gradient(90deg, var(--primary), #0099ff); color: #0a0c16; border: none;
            padding: 12px; border-radius: 12px; font-size: 0.95rem; font-weight: 800; font-family: 'Orbitron', sans-serif;
            cursor: pointer; transition: 0.3s; margin-top: 5px; box-shadow: 0 5px 15px rgba(0, 240, 255, 0.3);
        }

        .btn-action:hover { transform: scale(1.02); }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1); color: #fff; border: none;
            padding: 10px; border-radius: 12px; font-size: 0.85rem; font-weight: 700;
            cursor: pointer; transition: 0.3s; margin-top: 8px; width: 100%; display: none;
        }
        .btn-cancel:hover { background: rgba(255, 255, 255, 0.2); }

        .admin-item {
            background: rgba(10, 12, 22, 0.6); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px; padding: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px;
        }

        .admin-item-info { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .admin-item-img { width: 45px; height: 45px; object-fit: cover; border-radius: 8px; border: 1px solid var(--primary); flex-shrink: 0; }
        .admin-item-text h4 { font-size: 0.85rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .admin-item-text p { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .admin-actions { display: flex; gap: 6px; align-items: center; }

        .btn-tool {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff;
            padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 0.8rem;
        }
        .btn-tool:hover { background: var(--primary); color: var(--bg-dark); border-color: var(--primary); }

        .btn-delete {
            background: rgba(255, 0, 127, 0.15); border: 1px solid var(--secondary); color: var(--secondary);
            padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 0.8rem;
        }
        .btn-delete:hover { background: var(--secondary); color: #fff; }

        footer { text-align: center; margin-top: 30px; color: var(--text-muted); font-size: 0.75rem; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <div class="auth-icon"><i class="fa-solid fa-lock"></i></div>
            <h2 style="font-family: 'Orbitron', sans-serif; font-size: 1.1rem; margin-bottom: 5px;">Panel Protegido</h2>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">Ingresa tu clave de administrador</p>
            <form id="auth-form" style="display: flex; flex-direction: column; gap: 10px;">
                <input type="password" id="admin-pass" required placeholder="Contraseña..." class="form-control" style="text-align: center;">
                <button type="submit" class="btn-action">Entrar</button>
            </form>
            <a href="index.html" style="display: block; margin-top: 15px; font-size: 0.75rem; color: var(--text-muted); text-decoration: underline;">Volver a la tienda</a>
        </div>
    </div>

    <header>
        <h1 class="logo-title"><i class="fa-solid fa-shield-halved"></i> PANEL ADMIN</h1>
        <a href="index.html" class="btn-store"><i class="fa-solid fa-store"></i> Ver Tienda</a>
    </header>

    <main class="container">
        <section class="section-card">
            <div class="section-header" id="form-section-title">
                <i class="fa-solid fa-circle-plus"></i>
                <span>Publicar Nuevo Anuncio / Agenda</span>
            </div>

            <form id="offer-form">
                <input type="hidden" id="edit-index" value="-1">
                
                <div class="form-group">
                    <label for="title">Título del Anuncio</label>
                    <input type="text" id="title" class="form-control" placeholder="Ej: Agenda Semanal / Oferta 2x1" required>
                </div>
                
                <div class="form-group">
                    <label for="imageFile">Seleccionar Imagen <span id="img-optional-label" style="font-size: 0.7rem; color: var(--text-muted);">(Obligatoria para nuevo)</span></label>
                    <input type="file" id="imageFile" accept="image/*" class="form-control">
                </div>

                <div class="form-group">
                    <label for="description">Descripción Corta</label>
                    <textarea id="description" class="form-control" rows="4" placeholder="Detalles de la oferta o eventos..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="expireDate">Fecha y Hora de Expiración (Opcional - Se borra solo)</label>
                    <input type="datetime-local" id="expireDate" class="form-control">
                </div>
                
                <button type="submit" id="btn-submit" class="btn-action">
                    <i class="fa-solid fa-upload" style="margin-right: 5px;"></i> Guardar y Publicar
                </button>
                <button type="button" id="btn-cancel" class="btn-cancel" onclick="cancelEdit()">Cancelar Edición</button>
            </form>
        </section>

        <section class="section-card">
            <div class="section-header">
                <i class="fa-solid fa-list-check"></i>
                <span>Anuncios Activos en el Carrusel</span>
            </div>
            <div id="active-items-list"></div>
        </section>
    </main>

    <footer>
        <p>© Diamantes Express FF — Panel de Control</p>
    </footer>

    <script>
        const ADMIN_PASSWORD = "darian090827ff"; 

        document.addEventListener("DOMContentLoaded", () => {
            const authScreen = document.getElementById("auth-screen");
            const authForm = document.getElementById("auth-form");
            const passInput = document.getElementById("admin-pass");

            if (sessionStorage.getItem("admin_logged") === "true") {
                authScreen.style.display = "none";
            }

            authForm.addEventListener("submit", (e) => {
                e.preventDefault();
                if (passInput.value === ADMIN_PASSWORD) {
                    sessionStorage.setItem("admin_logged", "true");
                    authScreen.style.display = "none";
                } else {
                    alert("¡Contraseña incorrecta, bro!");
                    passInput.value = "";
                }
            });

            const form = document.getElementById("offer-form");
            const listContainer = document.getElementById("active-items-list");
            const editIndexInput = document.getElementById("edit-index");
            const btnSubmit = document.getElementById("btn-submit");
            const btnCancel = document.getElementById("btn-cancel");
            const formSectionTitle = document.getElementById("form-section-title");
            const imgOptionalLabel = document.getElementById("img-optional-label");

            function getItems() {
                const data = localStorage.getItem("express_carousel_items");
                let items = data ? JSON.parse(data) : [];

                // Validar y ejecutar el borrado automático por fecha de expiración
                const now = new Date().getTime();
                const filteredItems = items.filter(item => {
                    if (item.expireAt && now > item.expireAt) {
                        return false; // Expiró, se elimina
                    }
                    return true;
                });

                if (filteredItems.length !== items.length) {
                    localStorage.setItem("express_carousel_items", JSON.stringify(filteredItems));
                }

                return filteredItems;
            }

            function saveItems(items) {
                localStorage.setItem("express_carousel_items", JSON.stringify(items));
            }

            window.renderList = function() {
                const items = getItems();
                listContainer.innerHTML = "";

                if (items.length === 0) {
                    listContainer.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 10px;">No hay anuncios activos en este momento.</div>`;
                    return;
                }

                items.forEach((item, index) => {
                    const card = document.createElement("div");
                    card.className = "admin-item";
                    
                    // Mostrar tiempo restante si tiene expiración
                    let expireText = "";
                    if (item.expireAt) {
                        const timeLeft = Math.max(0, Math.floor((item.expireAt - new Date().getTime()) / 60000)); // en minutos
                        if (timeLeft < 60) {
                            expireText = ` ⏱️ Expira en ${timeLeft} min`;
                        } else {
                            expireText = ` ⏱️ Expira en ${Math.floor(timeLeft / 60)} hrs`;
                        }
                    }

                    card.innerHTML = `
                        <div class="admin-item-info">
                            <img src="${item.image}" class="admin-item-img" alt="Img">
                            <div class="admin-item-text">
                                <h4>${item.title}</h4>
                                <p>${item.description} <span style="color: var(--accent); font-size: 0.7rem;">${expireText}</span></p>
                            </div>
                        </div>
                        <div class="admin-actions">
                            ${index > 0 ? `<button onclick="moveItem(${index}, -1)" class="btn-tool" title="Subir"><i class="fa-solid fa-arrow-up"></i></button>` : ''}
                            ${index < items.length - 1 ? `<button onclick="moveItem(${index}, 1)" class="btn-tool" title="Bajar"><i class="fa-solid fa-arrow-down"></i></button>` : ''}
                            <button onclick="editItem(${index})" class="btn-tool" title="Editar"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteItem(${index})" class="btn-delete" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            }

            // Publicar o actualizar anuncio
            form.addEventListener("submit", (e) => {
                e.preventDefault();
                const title = document.getElementById("title").value;
                const description = document.getElementById("description").value;
                const fileInput = document.getElementById("imageFile");
                const expireInputVal = document.getElementById("expireDate").value;
                const editIdx = parseInt(editIndexInput.value);

                const expireAt = expireInputVal ? new Date(expireInputVal).getTime() : null;
                const items = getItems();

                function processAndSave(imageUrl) {
                    if (editIdx > -1) {
                        // Modo Edición
                        items[editIdx].title = title;
                        items[editIdx].description = description;
                        items[editIdx].expireAt = expireAt;
                        if (imageUrl) {
                            items[editIdx].image = imageUrl;
                        }
                        alert("¡Anuncio actualizado con éxito!");
                    } else {
                        // Modo Nuevo Anuncio
                        items.push({ title, image: imageUrl, description, expireAt });
                        alert("¡Anuncio publicado y guardado con éxito!");
                    }

                    saveItems(items);
                    cancelEdit();
                    renderList();
                }

                if (fileInput.files && fileInput.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const img = new Image();
                        img.onload = function() {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 800;
                            const MAX_HEIGHT = 800;
                            let width = img.width;
                            let height = img.height;

                            if (width > height) {
                                if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                            } else {
                                if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                            processAndSave(compressedDataUrl);
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(fileInput.files[0]);
                } else {
                    if (editIdx > -1) {
                        processAndSave(null); // Mantener la imagen vieja si no se subió una nueva al editar
                    } else {
                        alert("Por favor selecciona una imagen de tu galería.");
                    }
                }
            });

            // Función para Cargar Datos al Formulario para Editar
            window.editItem = function(index) {
                const items = getItems();
                const item = items[index];

                document.getElementById("title").value = item.title;
                document.getElementById("description").value = item.description;
                editIndexInput.value = index;

                if (item.expireAt) {
                    const dateObj = new Date(item.expireAt);
                    // Formatear a yyyy-MM-ddThh:mm para el input datetime-local
                    const localIso = new Date(dateObj.getTime() - (dateObj.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
                    document.getElementById("expireDate").value = localIso;
                } else {
                    document.getElementById("expireDate").value = "";
                }

                formSectionTitle.innerHTML = `<i class="fa-solid fa-pen-to-square"></i> <span>Editando Anuncio #${index + 1}</span>`;
                btnSubmit.innerHTML = `<i class="fa-solid fa-floppy-disk" style="margin-right: 5px;"></i> Guardar Cambios`;
                btnCancel.style.display = "block";
                imgOptionalLabel.innerText = "(Opcional: déjalo vacío para conservar la foto actual)";
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // Cancelar Edición
            window.cancelEdit = function() {
                form.reset();
                editIndexInput.value = "-1";
                formSectionTitle.innerHTML = `<i class="fa-solid fa-circle-plus"></i> <span>Publicar Nuevo Anuncio / Agenda</span>`;
                btnSubmit.innerHTML = `<i class="fa-solid fa-upload" style="margin-right: 5px;"></i> Guardar y Publicar`;
                btnCancel.style.display = "none";
                imgOptionalLabel.innerText = "(Obligatoria para nuevo)";
            };

            // Mover posición (Subir o Bajar orden)
            window.moveItem = function(index, direction) {
                const items = getItems();
                const newIndex = index + direction;

                if (newIndex >= 0 && newIndex < items.length) {
                    const temp = items[index];
                    items[index] = items[newIndex];
                    items[newIndex] = temp;
                    saveItems(items);
                    renderList();
                }
            };

            window.deleteItem = function(index) {
                if (confirm("¿Estás seguro de eliminar este anuncio?")) {
                    const items = getItems();
                    items.splice(index, 1);
                    saveItems(items);
                    renderList();
                }
            };

            renderList();
        });
    </script>
</body>
</html>
