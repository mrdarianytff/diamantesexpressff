<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Diamantes Express FF</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f0ff;
            --secondary: #ff007f;
            --accent: #ffe600;
            --bg-dark: #0a0c16;
            --card-bg: rgba(22, 27, 46, 0.9);
            --card-border: rgba(0, 240, 255, 0.3);
            --text: #ffffff;
            --text-muted: #a0aec0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background-color: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            padding: 20px 15px 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .admin-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 25px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .admin-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: var(--primary);
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
        }

        label {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .form-control {
            background: rgba(10, 12, 22, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        /* Checkbox Switch Custom */
        .switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .switch-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: #25D366; }
        input:checked + .slider:before { transform: translateX(24px); }

        /* Contenedor de Galería */
        .file-upload-btn {
            background: rgba(0, 240, 255, 0.15);
            border: 2px dashed var(--primary);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .file-upload-btn:hover {
            background: rgba(0, 240, 255, 0.25);
        }

        #preview-img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin-top: 10px;
            display: none;
            border: 1px solid var(--primary);
        }

        .btn-save {
            width: 100%;
            background: linear-gradient(90deg, #25D366, #128C7E);
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-save:hover {
            transform: scale(1.02);
        }

        .login-box {
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <!-- Pantalla de Login -->
        <div id="loginSection" class="login-box">
            <h2 class="admin-title"><i class="fa-solid fa-lock"></i> Acceso Administrador</h2>
            <div class="form-group">
                <label for="adminPass">Contraseña de Dueño:</label>
                <input type="password" id="adminPass" class="form-control" placeholder="Ingresa tu clave...">
            </div>
            <button class="btn-save" onclick="checkPassword()" style="background: linear-gradient(90deg, var(--primary), #0072ff);">Entrar al Panel</button>
        </div>

        <!-- Formulario del Panel (Oculto al inicio) -->
        <div id="adminPanel" style="display: none;">
            <h2 class="admin-title"><i class="fa-solid fa-sliders"></i> Publicar Oferta / Evento</h2>

            <div class="switch-container">
                <span class="switch-title"><i class="fa-solid fa-power-off"></i> Mostrar en la tienda</span>
                <label class="switch">
                    <input type="checkbox" id="offerActive">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="form-group">
                <label for="offerTitle"><i class="fa-solid fa-heading"></i> Título de la sección (Opcional):</label>
                <input type="text" id="offerTitle" class="form-control" placeholder="Ej: 🔥 ¡BOMBAZO DEL DÍA! 🔥 o 📅 AGENDA SEMANAL">
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-image"></i> Imagen / Afiche (Elige de tu Galería):</label>
                <div class="file-upload-btn" onclick="document.getElementById('fileInput').click()">
                    <i class="fa-solid fa-image-letter-case" style="font-size: 1.5rem; margin-bottom: 5px; display: block; color: var(--primary);"></i>
                    Toca aquí para elegir foto de la galería
                </div>
                <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                <img id="preview-img" alt="Vista previa">
            </div>

            <div class="form-group">
                <label for="offerText"><i class="fa-solid fa-align-left"></i> Texto / Descripción de la Oferta (Opcional):</label>
                <textarea id="offerText" class="form-control" placeholder="Escribe aquí los detalles, cupos disponibles, precios o instrucciones de la oferta..."></textarea>
            </div>

            <button class="btn-save" onclick="saveOffer()"><i class="fa-solid fa-floppy-disk"></i> Guardar y Publicar</button>
        </div>
    </div>

    <script>
        // CONTRASEÑA POR DEFECTO: 1234 (Puedes cambiarla en la línea de abajo)
        const SECRET_KEY = "darian090827ff";
        let base64ImageData = "";

        function checkPassword() {
            const pass = document.getElementById('adminPass').value;
            if (pass === SECRET_KEY) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadCurrentData();
            } else {
                alert("❌ Contraseña incorrecta, bro.");
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64ImageData = e.target.result;
                    const imgPreview = document.getElementById('preview-img');
                    imgPreview.src = base64ImageData;
                    imgPreview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function saveOffer() {
            const active = document.getElementById('offerActive').checked;
            const title = document.getElementById('offerTitle').value.trim();
            const text = document.getElementById('offerText').value.trim();

            const offerData = {
                active: active,
                title: title,
                text: text,
                image: base64ImageData
            };

            try {
                localStorage.setItem('express_special_offer', JSON.stringify(offerData));
                alert("✅ ¡Oferta publicada y guardada exitosamente en la web!");
            } catch(e) {
                alert("⚠️ La foto seleccionada es muy pesada para guardar directamente. Intenta recortarla o usar una de menor peso.");
            }
        }

        function loadCurrentData() {
            const data = localStorage.getItem('express_special_offer');
            if (data) {
                const parsed = JSON.parse(data);
                document.getElementById('offerActive').checked = parsed.active || false;
                document.getElementById('offerTitle').value = parsed.title || "";
                document.getElementById('offerText').value = parsed.text || "";
                if (parsed.image) {
                    base64ImageData = parsed.image;
                    const imgPreview = document.getElementById('preview-img');
                    imgPreview.src = parsed.image;
                    imgPreview.style.display = 'block';
                }
            }
        }
    </script>
</body>
</html>
