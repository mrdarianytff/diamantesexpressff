<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Diamantes Express FF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex flex-col justify-between">

    <!-- Header Admin -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-4 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <span class="bg-amber-500 text-slate-950 font-black px-2 py-1 rounded text-sm tracking-wider">ADM</span>
            <h1 class="font-extrabold text-lg tracking-wide text-white">PANEL <span class="text-amber-400">CONTROL</span></h1>
        </div>
        <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-bold border border-slate-700 transition">
            <i class="fa-solid fa-store mr-1"></i> Ver Tienda
        </a>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto w-full p-4 space-y-6 mb-12">

        <!-- Formulario para Agregar Nueva Oferta o Agenda -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-md">
            <h2 class="text-sm font-bold uppercase tracking-wider text-amber-400 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-circle-plus"></i> Publicar Nuevo Anuncio
            </h2>

            <form id="offer-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Título del Anuncio</label>
                    <input type="text" id="title" required placeholder="Ej: Agenda Semanal / Oferta 2x1" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">URL de la Imagen (Poster / Afiche)</label>
                    <input type="url" id="image" required placeholder="Pega el enlace de la imagen" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Descripción corta</label>
                    <textarea id="description" rows="2" required placeholder="Detalles de la oferta o eventos de la semana..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500"></textarea>
                </div>

                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition shadow-md">
                    <i class="fa-solid fa-upload mr-1"></i> Agregar al Carrusel
                </button>
            </form>
        </div>

        <!-- Lista de Anuncios Activos -->
        <div>
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-1.5">
                <i class="fa-solid fa-list-check text-amber-400"></i> Anuncios Publicados Actualmente
            </h2>
            <div id="active-items-list" class="space-y-3">
                <!-- Se llena con JavaScript -->
            </div>
        </div>

    </main>

    <!-- Script de Gestión -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("offer-form");
            const listContainer = document.getElementById("active-items-list");

            function getItems() {
                const data = localStorage.getItem("express_carousel_items");
                return data ? JSON.parse(data) : [];
            }

            function saveItems(items) {
                localStorage.setItem("express_carousel_items", JSON.stringify(items));
            }

            function renderList() {
                const items = getItems();
                listContainer.innerHTML = "";

                if (items.length === 0) {
                    listContainer.innerHTML = `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center text-xs text-slate-500">No hay anuncios activos en este momento.</div>`;
                    return;
                }

                items.forEach((item, index) => {
                    const card = document.createElement("div");
                    card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-3 flex items-center justify-between gap-3 shadow-sm";
                    
                    card.innerHTML = `
                        <div class="flex items-center space-x-3 overflow-hidden">
                            <img src="${item.image}" alt="${item.title}" class="w-12 h-12 object-cover rounded-xl bg-slate-950 flex-shrink-0">
                            <div class="overflow-hidden">
                                <h3 class="font-bold text-xs text-white truncate">${item.title}</h3>
                                <p class="text-[11px] text-slate-400 truncate">${item.description}</p>
                            </div>
                        </div>
                        <button onclick="deleteItem(${index})" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 px-3 py-2 rounded-xl text-xs transition flex-shrink-0 border border-red-500/20">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    `;
                    listContainer.appendChild(card);
                });
            }

            form.addEventListener("submit", (e) => {
                e.preventDefault();
                const title = document.getElementById("title").value;
                const image = document.getElementById("image").value;
                const description = document.getElementById("description").value;

                const items = getItems();
                items.push({ title, image, description });
                saveItems(items);

                form.reset();
                renderList();
                alert("¡Anuncio agregado con éxito al carrusel!");
            });

            window.deleteItem = function(index) {
                if (confirm("¿Estás seguro de eliminar este anuncio?")) {
                    const items = getItems();
                    items.splice(index, 1);
                    saveItems(items);
                    renderList();
                }
            };

            renderList();
        });
    </script>
</body>
</html>
