<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Diamantes Express</title>
    <!-- FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fuentes modernas de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f0ff;
            --secondary: #ff007f;
            --accent: #ffe600;
            --bg-dark: #0a0c16;
            --card-bg: rgba(22, 27, 46, 0.85);
            --card-border: rgba(0, 240, 255, 0.2);
            --text: #ffffff;
            --text-muted: #a0aec0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(255, 0, 127, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .admin-container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            color: var(--primary);
            margin-bottom: 25px;
            text-align: center;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .admin-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 25px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .admin-card h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            background: rgba(10, 12, 22, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .preview-box {
            width: 120px;
            height: 100px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--primary);
            margin-top: 10px;
            background: #000;
        }

        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-action {
            background: linear-gradient(90deg, var(--primary), #00a8ff);
            color: #0a0c16;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .btn-action:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .btn-danger {
            background: linear-gradient(90deg, #ff4d4d, #ff007f);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.8rem;
        }

        .btn-danger:hover {
            opacity: 0.9;
        }

        .item-row {
            background: rgba(10, 12, 22, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .item-info {
            flex-grow: 1;
        }

        .item-info h4 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .item-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 400px;
        }

        .alert-success {
            background: rgba(37, 211, 102, 0.2);
            border: 1px solid #25D366;
            color: #25D366;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1><i class="fa-solid fa-sliders"></i> Panel de Administración</h1>
        <div id="alertSuccess" class="alert-success">¡Cambios guardados con éxito en la web! ✅</div>

        <!-- SECCIÓN 1: GESTIÓN DE PORTADAS DE JUEGOS -->
        <div class="admin-card">
            <h3><i class="fa-solid fa-image" style="color: var(--primary);"></i> Portadas de los Juegos (Inicio)</h3>
            
            <!-- Free Fire -->
            <div class="form-group">
                <label>Enlace de imagen (URL) para Free Fire:</label>
                <input type="text" id="input-ff" placeholder="https://ejemplo.com/ff.jpg" oninput="actualizarPreview('ff')">
                <div class="preview-box">
                    <img id="prev-ff" src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500" alt="Preview FF">
                </div>
            </div>

            <!-- Blood Strike -->
            <div class="form-group" style="margin-top: 15px;">
                <label>Enlace de imagen (URL) para Blood Strike:</label>
                <input type="text" id="input-bs" placeholder="https://ejemplo.com/bs.jpg" oninput="actualizarPreview('bs')">
                <div class="preview-box">
                    <img id="prev-bs" src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=500" alt="Preview BS">
                </div>
            </div>

            <!-- Mobile Legends -->
            <div class="form-group" style="margin-top: 15px;">
                <label>Enlace de imagen (URL) para Mobile Legends:</label>
                <input type="text" id="input-ml" placeholder="https://ejemplo.com/ml.jpg" oninput="actualizarPreview('ml')">
                <div class="preview-box">
                    <img id="prev-ml" src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=500" alt="Preview ML">
                </div>
            </div>

            <button class="btn-action" onclick="guardarPortadas()" style="margin-top: 15px;">
                <i class="fa-solid fa-floppy-disk"></i> Guardar Portadas
            </button>
        </div>

        <!-- SECCIÓN 2: GESTIÓN DE ANUNCIOS / CARRUSEL -->
        <div class="admin-card">
            <h3><i class="fa-solid fa-bullhorn" style="color: var(--secondary);"></i> Anuncios del Carrusel</h3>
            
            <div class="form-group">
                <label>Título del Anuncio:</label>
                <input type="text" id="annTitle" placeholder="Ej: ¡Oferta Flash de Diamantes!">
            </div>
            <div class="form-group">
                <label>Enlace de la Imagen del Flyer/Anuncio (URL):</label>
                <input type="text" id="annImage" placeholder="https://ejemplo.com/flyer.jpg">
            </div>
            <div class="form-group">
                <label>Descripción / Texto del Anuncio:</label>
                <textarea id="annDesc" placeholder="Escribe los detalles de la oferta aquí..."></textarea>
            </div>

            <button class="btn-action" onclick="agregarAnuncio()">
                <i class="fa-solid fa-plus"></i> Agregar Anuncio al Carrusel
            </button>

            <div style="margin-top: 20px;">
                <label style="margin-bottom: 10px;">Anuncios Activos Actualmente:</label>
                <div id="adminCarouselList">
                    <!-- Se listan dinámicamente -->
                </div>
            </div>
        </div>

    </div>

    <script>
        let carouselItems = [];

        window.addEventListener('DOMContentLoaded', () => {
            // Cargar portadas guardadas
            const savedImages = JSON.parse(localStorage.getItem('diamantes_game_covers')) || {};
            if (savedImages.ff) {
                document.getElementById('input-ff').value = savedImages.ff;
                document.getElementById('prev-ff').src = savedImages.ff;
            }
            if (savedImages.bs) {
                document.getElementById('input-bs').value = savedImages.bs;
                document.getElementById('prev-bs').src = savedImages.bs;
            }
            if (savedImages.ml) {
                document.getElementById('input-ml').value = savedImages.ml;
                document.getElementById('prev-ml').src = savedImages.ml;
            }

            // Cargar carrusel guardado
            const savedCarousel = localStorage.getItem('express_carousel_items');
            if (savedCarousel) {
                try {
                    carouselItems = JSON.parse(savedCarousel);
                } catch(e) {
                    carouselItems = [];
                }
            }
            renderAdminCarousel();
        });

        function actualizarPreview(game) {
            const url = document.getElementById(`input-${game}`).value.trim();
            if (url) {
                document.getElementById(`prev-${game}`).src = url;
            }
        }

        function guardarPortadas() {
            const covers = {
                ff: document.getElementById('input-ff').value.trim(),
                bs: document.getElementById('input-bs').value.trim(),
                ml: document.getElementById('input-ml').value.trim()
            };

            localStorage.setItem('diamantes_game_covers', JSON.stringify(covers));
            mostrarAlerta();
        }

        function agregarAnuncio() {
            const title = document.getElementById('annTitle').value.trim();
            const image = document.getElementById('annImage').value.trim();
            const description = document.getElementById('annDesc').value.trim();

            if (!title && !image && !description) {
                alert("Por favor completa al menos un campo para el anuncio.");
                return;
            }

            carouselItems.push({ title, image, description });
            localStorage.setItem('express_carousel_items', JSON.stringify(carouselItems));

            document.getElementById('annTitle').value = '';
            document.getElementById('annImage').value = '';
            document.getElementById('annDesc').value = '';

            renderAdminCarousel();
            mostrarAlerta();
        }

        function eliminarAnuncio(index) {
            carouselItems.splice(index, 1);
            localStorage.setItem('express_carousel_items', JSON.stringify(carouselItems));
            renderAdminCarousel();
            mostrarAlerta();
        }

        function renderAdminCarousel() {
            const listEl = document.getElementById('adminCarouselList');
            if (carouselItems.length === 0) {
                listEl.innerHTML = `<p style="font-size: 0.85rem; color: var(--text-muted);">No hay anuncios activos en el carrusel.</p>`;
                return;
            }

            let html = "";
            carouselItems.forEach((item, index) => {
                html += `
                    <div class="item-row">
                        <div class="item-info">
                            <h4>${item.title || 'Anuncio sin título'}</h4>
                            <p>${item.description || item.image || 'Sin texto'}</p>
                        </div>
                        <button class="btn-danger" onclick="eliminarAnuncio(${index})">
                            <i class="fa-solid fa-trash"></i> Eliminar
                        </button>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        function mostrarAlerta() {
            const alertBox = document.getElementById('alertSuccess');
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
